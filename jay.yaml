port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - +.in-addr.arpa
  - +.ip6.arpa
  - time.*.com
  - time.*.gov
  - pool.ntp.org
  - localhost.work.weixin.qq.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
proxies: []
proxy-groups:
- name: 总模式
  type: select
  proxies:
  - 自动选择
  - 负载均衡
  - 手动选择
  - DIRECT
- name: 自动选择
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 120
  tolerance: 20
  lazy: false
  idle-timeout: 300
  proxies: []
- name: 负载均衡
  type: load-balance
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  lazy: false
  strategy: round-robin
  proxies: []
- name: 手动选择
  type: select
  proxies:
  - 自动选择
- name: AI大模型
  type: select
  proxies:
  - 总模式
- name: Telegram
  type: select
  proxies:
  - 总模式
- name: Netflix
  type: select
  proxies:
  - 总模式
- name: YouTube
  type: select
  proxies:
  - 总模式
  - 自动选择
- name: Apple
  type: select
  proxies:
  - DIRECT
  - 总模式
  - 自动选择
- name: Microsoft
  type: select
  proxies:
  - DIRECT
  - 总模式
  - 自动选择
- name: 漏网之鱼
  type: select
  proxies:
  - 总模式
  - 自动选择
  - 负载均衡
  - 手动选择
  - DIRECT
